<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes Rastreamento — Rastreie sua Carga</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 36px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 16px;
      display: inline-block;
    }
    h1 {
      font-size: 1.4rem;
      color: #38bdf8;
      margin-bottom: 12px;
      font-weight: 600;
    }
    p {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    input {
      flex: 1;
      padding: 12px 16px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #38bdf8;
    }
    button {
      padding: 12px 20px;
      background: #0284c7;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #0369a1;
    }
    .help-text {
      font-size: 0.8rem;
      color: #64748b;
      border-top: 1px solid #334155;
      padding-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🚚</div>
    <h1>Hermes Rastreamento</h1>
    <p>Insira o código ou abra o link de rastreio exclusivo enviado para o seu WhatsApp.</p>
    
    <form onsubmit="handleTrack(event)" class="input-group">
      <input id="tokenInput" type="text" placeholder="Cole o código do token aqui..." required />
      <button type="submit">Rastrear</button>
    </form>

    <div class="help-text">
      Não tem um código? Verifique as mensagens recentes enviadas pelo remetente da carga no WhatsApp.
    </div>
  </div>

  <script>
    function handleTrack(e) {
      e.preventDefault();
      const val = document.getElementById('tokenInput').value.trim();
      if (!val) return;
      // Se colou a URL inteira, extrai o token
      if (val.includes('/r/')) {
        window.location.href = val;
      } else {
        window.location.href = '/r/' + encodeURIComponent(val);
      }
    }
  </script>
</body>
</html>
