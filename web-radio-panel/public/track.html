<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acompanhamento de Entrega — Hermes</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
    header { background: #1e293b; padding: 14px 20px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 1.05rem; color: #38bdf8; }
    .status-badge { background: #065f46; color: #34d399; padding: 4px 12px; border-radius: 20px; font-size: 0.78rem; font-weight: bold; text-transform: uppercase; }
    #map { flex: 1; width: 100%; }
    .footer { background: #1e293b; padding: 12px 20px; border-top: 1px solid #334155; font-size: 0.85rem; color: #94a3b8; display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; }
    .expired-box { display: none; margin: auto; text-align: center; padding: 30px; background: #1e293b; border-radius: 10px; border: 1px solid #ef4444; max-width: 420px; }
  </style>
</head>
<body>
  <header>
    <h1>🚚 Rastreio ao Vivo — Hermes Logística</h1>
    <span id="os-badge" class="status-badge">CARREGANDO...</span>
  </header>

  <div id="map"></div>

  <div id="expired-msg" class="expired-box">
    <h2 style="color: #ef4444; margin-bottom: 10px;">Link Expirado ou Inválido</h2>
    <p>Esta entrega já foi concluída ou o link de rastreio perdeu a validade de segurança.</p>
  </div>

  <footer class="footer">
    <span>OS: <strong id="os-id" style="color: white;">--</strong></span>
    <span>Motorista: <strong id="driver-name" style="color: white;">Aguardando</strong></span>
    <span>Atualização: <strong id="last-update" style="color: white;">ao vivo</strong></span>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const token = window.location.pathname.split('/').pop();
    const map = L.map('map').setView([-5.7945, -35.2084], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    const routeLayer = L.layerGroup().addTo(map);
    let markerMoto = null;
    let markerColeta = null;
    let stopMarkers = [];
    let fittedOnce = false;

    const motoIcon = L.divIcon({
      className: 'custom-moto-icon',
      html: `<div style="background:#ea580c;color:#fff;padding:6px;border-radius:50%;box-shadow:0 4px 10px rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;width:36px;height:36px;border:2px solid #fff;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18.5" cy="17.5" r="3.5"/><circle cx="5.5" cy="17.5" r="3.5"/><circle cx="15" cy="5" r="1"/><path d="M12 17.5V14l-3-3 4-3 2 3h2"/></svg>
      </div>`,
      iconSize: [36, 36],
      iconAnchor: [18, 18]
    });

    const coletaIcon = L.divIcon({
      className: 'custom-store-icon',
      html: `<div style="background:#b91c1c;color:#fff;border-radius:50%;box-shadow:0 3px 8px rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;width:30px;height:30px;border:2px solid #fff;font-weight:700;font-size:12px;">C</div>`,
      iconSize: [30, 30],
      iconAnchor: [15, 15]
    });

    function makeStopIcon(num) {
      return L.divIcon({
        className: 'custom-dest-icon',
        html: `<div style="background:#15803d;color:#fff;border-radius:50%;box-shadow:0 3px 8px rgba(0,0,0,0.35);display:flex;align-items:center;justify-content:center;width:30px;height:30px;border:2px solid #fff;font-weight:700;font-size:11px;">#${num}</div>`,
        iconSize: [30, 30],
        iconAnchor: [15, 15]
      });
    }

    async function fetchOsrmSegment(points) {
      if (points.length < 2) return [];
      const coordsStr = points.map(p => `${p.lon},${p.lat}`).join(';');
      try {
        const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${coordsStr}?overview=full&geometries=geojson`);
        if (res.ok) {
          const data = await res.json();
          const coords = data?.routes?.[0]?.geometry?.coordinates;
          if (Array.isArray(coords) && coords.length) {
            return coords.map(([lon, lat]) => [lat, lon]);
          }
        }
      } catch {}
      return points.map(p => [p.lat, p.lon]);
    }

    async function checkToken() {
      try {
        const res = await fetch(`/api/tracking/verify/${encodeURIComponent(token)}`, { cache: 'no-store' });
        if (!res.ok) {
          document.getElementById('map').style.display = 'none';
          document.getElementById('expired-msg').style.display = 'block';
          document.getElementById('os-badge').textContent = 'EXPIRADO';
          document.getElementById('os-badge').style.background = '#7f1d1d';
          document.getElementById('os-badge').style.color = '#fca5a5';
          return;
        }
        const payload = await res.json();
        const order = payload.order || {};
        const osId = order.id || payload.data?.os_id || 'OS Ativa';
        document.getElementById('os-id').textContent = osId;
        document.getElementById('os-badge').textContent = (order.status || 'EM ROTA').replace('_', ' ').toUpperCase();
        document.getElementById('driver-name').textContent = payload.driver?.name || order.driver_name || 'Na fila / designando';
        document.getElementById('last-update').textContent = new Date().toLocaleTimeString('pt-BR');

        // Posição real do motoboy: prioridade para hermes_drivers.lat/lon ao vivo
        const drvLat = payload.driver?.lat ?? payload.vehicle?.lat ?? null;
        const drvLon = payload.driver?.lon ?? payload.vehicle?.lon ?? null;

        const boundsPts = [];
        if (drvLat != null && drvLon != null) {
          const ll = [Number(drvLat), Number(drvLon)];
          boundsPts.push(ll);
          if (!markerMoto) {
            markerMoto = L.marker(ll, { icon: motoIcon }).addTo(map).bindPopup(`<b>${payload.driver?.name || order.driver_name || 'Motoboy'}</b><br>Posição em tempo real`);
          } else {
            markerMoto.setLatLng(ll);
          }
        }

        const coletaPt = (order.origin_lat != null && order.origin_lon != null)
          ? { lat: Number(order.origin_lat), lon: Number(order.origin_lon) }
          : null;
        if (coletaPt) {
          boundsPts.push([coletaPt.lat, coletaPt.lon]);
          if (!markerColeta) {
            markerColeta = L.marker([coletaPt.lat, coletaPt.lon], { icon: coletaIcon })
              .addTo(map).bindPopup(`<b>Ponto de Coleta</b><br>${order.origin_address || ''}`);
          }
        }

        const rawStops = (Array.isArray(payload.stops) && payload.stops.length)
          ? payload.stops
          : (Array.isArray(order.destinations) ? order.destinations : []).filter(d => d && d.lat != null && d.lon != null);

        stopMarkers.forEach(m => m.remove());
        stopMarkers = [];
        const stopPts = [];
        rawStops.forEach((s, idx) => {
          const pt = { lat: Number(s.lat), lon: Number(s.lon), address: s.address || '' };
          stopPts.push(pt);
          boundsPts.push([pt.lat, pt.lon]);
          const mk = L.marker([pt.lat, pt.lon], { icon: makeStopIcon(idx + 1) })
            .addTo(map).bindPopup(`<b>Parada #${idx + 1}</b><br>${pt.address}`);
          stopMarkers.push(mk);
        });

        routeLayer.clearLayers();
        const motoPt = (drvLat != null && drvLon != null) ? { lat: Number(drvLat), lon: Number(drvLon) } : null;

        // Trecho 1: Motoboy -> Coleta
        if (motoPt && coletaPt) {
          const seg1 = await fetchOsrmSegment([motoPt, coletaPt]);
          if (seg1.length) {
            L.polyline(seg1, { color: '#0284c7', weight: 4, opacity: 0.9, dashArray: '8, 8' }).addTo(routeLayer);
          }
        }

        // Trecho 2+: Coleta (ou Motoboy) -> #1 -> #2...
        const deliveryChain = [
          ...(coletaPt ? [coletaPt] : (motoPt ? [motoPt] : [])),
          ...stopPts
        ];
        if (deliveryChain.length >= 2) {
          const seg2 = await fetchOsrmSegment(deliveryChain);
          if (seg2.length) {
            L.polyline(seg2, { color: '#10b981', weight: 4, opacity: 0.9, dashArray: '8, 8' }).addTo(routeLayer);
          }
        }

        if (!fittedOnce && boundsPts.length) {
          fittedOnce = true;
          map.fitBounds(L.latLngBounds(boundsPts).pad(0.2));
        }
      } catch (e) {
        document.getElementById('os-badge').textContent = 'ERRO DE CONEXÃO';
      }
    }

    checkToken();
    setInterval(checkToken, 4000);
  </script>
</body>
</html>
